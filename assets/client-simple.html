<!DOCTYPE html>
<html lang="@lang@" dir="@dir@">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta property="og:title" content="@page_title@" />
    <meta property="og:description" content="@og_description@" />
    <meta property="og:image" content="https://adnihilum.net/og-image.png" />
    <meta property="og:url" content="https://adnihilum.net/simple/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>@page_title@</title>
    <link rel="icon" type="image/png" href="adnihilum128.png">
    <link rel="stylesheet" href="client-simple.css">
</head>

<body
    data-i18n='{"action_needed":"@action_needed@","too_large":"@too_large@","very_close_limit":"@very_close_limit@","approaching_limit":"@approaching_limit@","create_link_error":"@create_link_error@","invalid_service_url":"@invalid_service_url@","origin_credentials":"@origin_credentials@","origin_path":"@origin_path@","origin_https":"@origin_https@","generated_invalid":"@generated_invalid@","clipboard_image_unavailable":"@clipboard_image_unavailable@","clipboard_text_unavailable":"@clipboard_text_unavailable@","service_unreachable":"@service_unreachable@","server_refused":"@server_refused@","server_busy":"@server_busy@","rate_limited":"@rate_limited@","server_failed":"@server_failed@","create_secret_failed":"@create_secret_failed@","creating_link":"@creating_link@","nothing_to_send":"@nothing_to_send@","enter_secret":"@enter_secret@","secret_too_large":"@secret_too_large@","shorten_secret":"@shorten_secret@","link_copied":"@link_copied@","link_ready":"@link_ready@","link_created":"@link_created@","broken_link":"@broken_link@","secret_unavailable":"@secret_unavailable@","secret_damaged":"@secret_damaged@","secret_prepare_failed":"@secret_prepare_failed@","open_secret_failed":"@open_secret_failed@","open_full_link":"@open_full_link@","receiving_secret":"@receiving_secret@","no_pending_secret":"@no_pending_secret@","wrong_password":"@wrong_password@","copied":"@copied@","copy_failed":"@copy_failed@"}'>
    <main class="app">
        <header class="topbar">
            <a class="brand" href="/">
                <img src="adnihilum128.png" width="40" height="40" alt="">
                <span>Ad Nihilum</span>
            </a>
            <a class="topbar-link"
                href="https://github.com/x6prl/adnihilum/#what-ad-nihilum-does-not-protect-against">@be_careful@</a>
        </header>
        <noscript>
            @javascript_required_body@
        </noscript>

        <section class="composer">
            <textarea id="text" tabindex="1" autofocus autocomplete="off" data-limit-indicator="true"
                data-placeholder-desktop="@message_placeholder_desktop@"
                data-placeholder-mobile="@message_placeholder_mobile@"
                placeholder="@message_placeholder_desktop@"></textarea>

            <input id="optionalPassword" tabindex="2" type="password" autocomplete="new-password" spellcheck="false"
                placeholder="@password_optional@">

            <div class="share-row">
                <div class="actions">
                    <button class="primary-btn" id="btnGetLink" tabindex="3" type="button"
                        data-default-label="@create_copy_link@">
                        <span id="btnGetLinkLabel">@create_copy_link@</span>
                    </button>
                    <button class="secondary-btn" id="btnCopyLink" type="button" hidden>@copy_link@</button>
                </div>

                <div class="generated-output" id="generatedWrap" hidden>
                    <input id="generatedUrl" type="text" readonly autocomplete="off" spellcheck="false">
                </div>
            </div>
        </section>
    </main>

    <dialog class="app-popup" id="appPopup" aria-labelledby="appPopupTitle">
        <form class="app-popup-card" method="dialog">
            <h2 id="appPopupTitle">@javascript_required@</h2>
            <p id="appPopupBody">@javascript_required_body@</p>
            <button class="primary-btn" type="submit">@ok@</button>
        </form>
    </dialog>

    <script src="client-shared.js"></script>
    <script src="client-send.js"></script>
    <script src="client.js"></script>
</body>

</html>
