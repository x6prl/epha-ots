<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>@page_title@</title>
    <link rel="icon" type="image/png" href="adnihilum128.png">
    <link rel="stylesheet" href="client.css">
</head>
<body class="page page-receive" data-i18n='{"action_needed":"@action_needed@","too_large":"@too_large@","very_close_limit":"@very_close_limit@","approaching_limit":"@approaching_limit@","create_link_error":"@create_link_error@","invalid_service_url":"@invalid_service_url@","origin_credentials":"@origin_credentials@","origin_path":"@origin_path@","origin_https":"@origin_https@","generated_invalid":"@generated_invalid@","clipboard_image_unavailable":"@clipboard_image_unavailable@","clipboard_text_unavailable":"@clipboard_text_unavailable@","service_unreachable":"@service_unreachable@","server_refused":"@server_refused@","server_busy":"@server_busy@","rate_limited":"@rate_limited@","server_failed":"@server_failed@","create_secret_failed":"@create_secret_failed@","creating_link":"@creating_link@","nothing_to_send":"@nothing_to_send@","enter_secret":"@enter_secret@","secret_too_large":"@secret_too_large@","shorten_secret":"@shorten_secret@","link_copied":"@link_copied@","link_ready":"@link_ready@","link_created":"@link_created@","broken_link":"@broken_link@","secret_unavailable":"@secret_unavailable@","secret_damaged":"@secret_damaged@","secret_prepare_failed":"@secret_prepare_failed@","open_secret_failed":"@open_secret_failed@","open_full_link":"@open_full_link@","receiving_secret":"@receiving_secret@","no_pending_secret":"@no_pending_secret@","wrong_password":"@wrong_password@","copied":"@copied@","copy_failed":"@copy_failed@"}'>
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="/" data-create-link="true">
                <img src="adnihilum128.png" width="40" height="40" alt="Ad Nihilum">
                <div>
                    <strong>Ad Nihilum</strong>
                    <span>@tagline@</span>
                </div>
            </a>
            <nav class="topbar-links" aria-label="Primary">
                <a href="https://github.com/x6prl/adnihilum/#what-ad-nihilum-does-not-protect-against">@be_careful@</a>
                <a href="https://github.com/x6prl/adnihilum/">@github@</a>
            </nav>
        </header>

        <main class="layout-single">
            <section class="panel panel-primary viewer-panel">
                <div class="stack">
                    <div class="field-group field-group-main">
                        <label for="text">@the_message@</label>
                        <output id="text" class="message-output receive-state-info" tabindex="0">@open_full_link_initial@</output>
                    </div>

                    <div class="action-row">
                        <button class="primary-btn" id="copySecretBtn" type="button">@copy_text@</button>
                        <a class="secondary-btn primary-btn-link" data-create-link="true" href="/">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 5v14M5 12h14"></path>
                            </svg>
                            <span>@create_own_secret@</span>
                        </a>
                    </div>

                    <section class="decryption-card" id="decryptionCard">
                        <div class="decryption-copy">
                            <h2>@password_required@</h2>
                            <p class="field-note">@enter_shared_password@</p>
                        </div>
                        <div class="field-grid">
                            <div class="field-group">
                                <label for="decryptionPassword">@password@</label>
                                <input id="decryptionPassword" type="password" autocomplete="current-password" spellcheck="false" placeholder="@password_receive_placeholder@">
                            </div>
                            <div class="inline-action">
                                <button id="decryptBtn" class="primary-btn" type="button">@open_secret@</button>
                            </div>
                        </div>
                    </section>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="footer-block">
                <strong>Ad Nihilum</strong>
                <p>@footer_body@</p>
            </div>
            <div class="footer-links">
                <a href="https://github.com/x6prl/adnihilum/">@github@</a>
                <a href="https://github.com/x6prl/adnihilum/blob/master/README.md">@readme@</a>
                <a href="mailto:x6prlie@gmail.com">x6prlie@gmail.com</a>
                <a href="https://t.me/x6prl">Telegram</a>
            </div>
        </footer>
    </div>

    <script src="client-shared.js"></script>
    <script src="client-receive.js"></script>
    <script src="client.js"></script>
</body>
</html>
